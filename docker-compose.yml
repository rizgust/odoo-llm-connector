services:
  odoo-gpt-mcp:
    build: .
    env_file: .env
    environment:
      REPORTS_FILE: /config/reports.yaml
    volumes:
      - ./config/reports.yaml:/config/reports.yaml:ro  # edit and restart to change report definitions
    ports:
      - "127.0.0.1:8000:8000"  # put an HTTPS reverse proxy or tunnel in front; don't expose plain HTTP
    restart: unless-stopped
